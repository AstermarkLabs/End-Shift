openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: profiles
    description: User profiles
  - name: roles
    description: Roles & rights
  - name: onboarding
    description: Onboarding flow
  - name: org-units
    description: Organisational unit hierarchy
  - name: checklists
    description: Checklist templates owned by locations
  - name: shifts
    description: Shift logs and task completions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens + profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created — tokens + profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "409":
          description: Email already in use

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Signed out

  /auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /auth/passkey/register-options:
    post:
      operationId: passkeyRegisterOptions
      tags: [auth]
      summary: Generate passkey registration options
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"

  /auth/passkey/register-verify:
    post:
      operationId: passkeyRegisterVerify
      tags: [auth]
      summary: Verify passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterVerifyRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCredential"

  /auth/passkey/auth-options:
    post:
      operationId: passkeyAuthOptions
      tags: [auth]
      summary: Generate passkey assertion options
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthOptionsRequest"
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"

  /auth/passkey/auth-verify:
    post:
      operationId: passkeyAuthVerify
      tags: [auth]
      summary: Verify passkey assertion and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthVerifyRequest"
      responses:
        "200":
          description: Tokens + profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"

  /profiles/me:
    get:
      operationId: getMe
      tags: [profiles]
      summary: Get current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateMe
      tags: [profiles]
      summary: Update current user profile (e.g. password, email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "409":
          description: Email already in use

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List profiles (scoped to caller's tenant and org unit)
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updateProfile
      tags: [profiles]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    delete:
      operationId: deleteProfile
      tags: [profiles]
      summary: Delete profile
      responses:
        "204":
          description: Deleted

  /profiles/{id}/passkeys:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listProfilePasskeys
      tags: [profiles]
      summary: List passkeys for a profile
      responses:
        "200":
          description: Passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyCredential"

  /profiles/{id}/passkeys/{credentialId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteProfilePasskey
      tags: [profiles]
      summary: Delete a passkey
      responses:
        "204":
          description: Deleted

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles (scoped to caller's tenant + system roles)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updateRole
      tags: [roles]
      summary: Update role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete role
      responses:
        "204":
          description: Deleted

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Create team member accounts gathered during onboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingCompleteRequest"
      responses:
        "200":
          description: Accounts created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCompleteResponse"

  /org-units:
    get:
      operationId: listOrgUnits
      tags: [org-units]
      summary: List org units for the caller's tenant
      responses:
        "200":
          description: Org units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgUnit"
    post:
      operationId: createOrgUnit
      tags: [org-units]
      summary: Create an org unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgUnitRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnit"

  /org-units/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updateOrgUnit
      tags: [org-units]
      summary: Update an org unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgUnitRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnit"
    delete:
      operationId: deleteOrgUnit
      tags: [org-units]
      summary: Delete an org unit (must have no children and no assigned users)
      responses:
        "204":
          description: Deleted

  # ── Checklists ──────────────────────────────────────────────────────────────

  /checklists:
    get:
      operationId: listChecklists
      tags: [checklists]
      summary: List checklists for the caller's tenant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of checklists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checklist"
    post:
      operationId: createChecklist
      tags: [checklists]
      summary: Create a new checklist
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"

  /checklists/import/pdf:
    post:
      operationId: importChecklistFromPdf
      tags: [checklists]
      summary: Upload a PDF and extract checklist sections and tasks via OCR
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PdfUpload"
      responses:
        "200":
          description: Parsed checklist structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfImportResult"
        "400":
          description: No file uploaded or invalid file type
        "422":
          description: Could not extract text from PDF

  /checklists/{id}:
    get:
      operationId: getChecklist
      tags: [checklists]
      summary: Get a checklist with its tasks
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Checklist with tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistWithTasks"
        "404":
          description: Not found
    put:
      operationId: updateChecklist
      tags: [checklists]
      summary: Update a checklist's name or location
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistUpdate"
      responses:
        "200":
          description: Updated checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
        "404":
          description: Not found
    delete:
      operationId: deleteChecklist
      tags: [checklists]
      summary: Delete a checklist and all its tasks
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /checklists/{id}/tasks:
    get:
      operationId: listChecklistTasks
      tags: [checklists]
      summary: List tasks for a checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistTask"
    post:
      operationId: createChecklistTask
      tags: [checklists]
      summary: Add a task to a checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTask"

  /checklists/{id}/tasks/{taskId}:
    put:
      operationId: updateChecklistTask
      tags: [checklists]
      summary: Update a checklist task
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTask"
        "404":
          description: Not found
    delete:
      operationId: deleteChecklistTask
      tags: [checklists]
      summary: Delete a checklist task
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /checklists/{id}/roles:
    get:
      operationId: getChecklistRoles
      tags: [checklists]
      summary: Get role restrictions for a checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role restrictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRoles"
        "404":
          description: Not found
    put:
      operationId: updateChecklistRoles
      tags: [checklists]
      summary: Set role restrictions for a checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistRolesUpdate"
      responses:
        "200":
          description: Updated role restrictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRoles"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /checklists/{id}/shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: List shift logs for a checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftLog"
    post:
      operationId: openShift
      tags: [shifts]
      summary: Open a new shift for a checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Opened shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftWithCompletions"

  # ── Shifts ───────────────────────────────────────────────────────────────────

  /shifts/{id}:
    get:
      operationId: getShift
      tags: [shifts]
      summary: Get a shift log with its task completions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shift with completions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftWithCompletions"
        "404":
          description: Not found

  /shifts/{id}/submit:
    post:
      operationId: submitShift
      tags: [shifts]
      summary: Submit (close out) a shift
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftSubmitInput"
      responses:
        "200":
          description: Submitted shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftWithCompletions"
        "404":
          description: Not found

  /shifts/{id}/tasks/{taskId}/complete:
    post:
      operationId: completeShiftTask
      tags: [shifts]
      summary: Mark a task complete in a shift
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Task marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTaskCompletion"
        "404":
          description: Not found
        "409":
          description: Already complete
    delete:
      operationId: uncompleteShiftTask
      tags: [shifts]
      summary: Unmark a task completion in a shift
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Completion removed
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    JsonObject:
      type: object
      additionalProperties: true

    Right:
      type: string
      enum:
        - manage_profiles
        - assign_roles
        - manage_roles
        - manage_org_units
        - create_checklists
        - edit_checklists
        - delete_checklists
        - view_reports
        - manage_checklist_settings

    OrgUnitType:
      type: string
      enum: [region, district, location]

    OrgUnit:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        parentId:
          type: integer
          nullable: true
        name:
          type: string
        type:
          $ref: "#/components/schemas/OrgUnitType"
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, name, type, createdAt]

    CreateOrgUnitRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/OrgUnitType"
        parentId:
          type: integer
          nullable: true
      required: [name, type]

    UpdateOrgUnitRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        parentId:
          type: integer
          nullable: true

    Role:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
          nullable: true
        name:
          type: string
        level:
          type: integer
        isSystem:
          type: boolean
        rights:
          type: array
          items:
            $ref: "#/components/schemas/Right"
      required: [id, name, level, isSystem, rights]

    CreateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        level:
          type: integer
        rights:
          type: array
          items:
            $ref: "#/components/schemas/Right"
      required: [name, level, rights]

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        level:
          type: integer
        rights:
          type: array
          items:
            $ref: "#/components/schemas/Right"

    Profile:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
          nullable: true
        orgUnitId:
          type: integer
          nullable: true
        orgUnit:
          $ref: "#/components/schemas/OrgUnit"
          nullable: true
        username:
          type: string
        email:
          type: string
          format: email
          nullable: true
        displayName:
          type: string
        roleId:
          type: integer
        role:
          $ref: "#/components/schemas/Role"
        mustChangePassword:
          type: boolean
        isActive:
          type: boolean
      required: [id, username, displayName, roleId, role, mustChangePassword, isActive]

    CreateProfileRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
          pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$'
        roleId:
          type: integer
        orgUnitId:
          type: integer
          nullable: true
        mustChangePassword:
          type: boolean
      required: [username, displayName, password, roleId]

    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
          pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$'
        roleId:
          type: integer
        orgUnitId:
          type: integer
          nullable: true
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean

    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          nullable: true
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
          pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$'

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
          pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$'
        businessName:
          type: string
          minLength: 1
        businessType:
          type: string
          enum: [single-unit, multi-unit]
      required: [username, email, password, businessName, businessType]

    LoginRequest:
