kind = "mobile"
previewPath = "/"
title = "End Shift"
version = "1.0.0"
id = "artifacts/checklist"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25016

[services.development]
run = "pnpm --filter @workspace/checklist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/checklist", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/checklist", "run", "serve" ]

[services.env]
PORT = "25016"
BASE_PATH = "/"
